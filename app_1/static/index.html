<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Insights Platform</title>
    <style>
        /* --- Enterprise Design System --- */
        :root {
            --bg-dark: #0f172a;        /* Sleek dark sidebar */
            --bg-main: #f8fafc;        /* App background */
            --surface: #ffffff;        /* Card background */
            --border: #e2e8f0;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent: #2563eb;         /* Professional Blue */
            --accent-hover: #1d4ed8;
            --danger: #ef4444;
            --font-sm: 13px;
            --font-md: 14px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: var(--font-md); color: var(--text-main); background: var(--bg-main); display: flex; height: 100vh; overflow: hidden; }

        /* --- Sidebar Navigation --- */
        .sidebar { width: 220px; background: var(--bg-dark); color: #cbd5e1; display: flex; flex-direction: column; border-right: 1px solid #1e293b; }
        .sidebar-header { padding: 20px; font-weight: 600; font-size: 15px; color: white; border-bottom: 1px solid #1e293b; display: flex; align-items: center; gap: 8px; }
        .nav-items { padding: 10px 0; flex: 1; }
        .nav-item { padding: 10px 20px; cursor: pointer; font-size: var(--font-sm); transition: 0.2s; display: flex; align-items: center; gap: 10px; border-left: 3px solid transparent; }
        .nav-item:hover { background: #1e293b; color: white; }
        .nav-item.active { background: #1e293b; color: white; border-left-color: var(--accent); }

        /* --- Main Content Area --- */
        .main-view { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .header { height: 50px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; font-weight: 500; font-size: var(--font-sm); }
        .content { flex: 1; overflow-y: auto; padding: 20px; display: none; }
        .content.active { display: flex; flex-direction: column; gap: 20px; }

        /* --- Compact File Uploader --- */
        .upload-bar { display: flex; gap: 10px; background: var(--surface); padding: 15px; border: 1px solid var(--border); border-radius: 6px; align-items: center; }
        .file-input-wrapper { flex: 1; display: flex; align-items: center; gap: 10px; }
        input[type="file"] { font-size: var(--font-sm); }
        .btn { padding: 6px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; font-size: var(--font-sm); font-weight: 500; cursor: pointer; transition: 0.2s; color: var(--text-main); }
        .btn:hover:not(:disabled) { background: #f1f5f9; }
        .btn-primary { background: var(--accent); color: white; border-color: var(--accent); }
        .btn-primary:hover:not(:disabled) { background: var(--accent-hover); color: white; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }

        /* --- Data Quality Metrics Grid --- */
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; display: none; }
        .metric-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 15px; }
        .metric-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; }
        .metric-value { font-size: 20px; font-weight: 600; color: var(--text-main); }
        .metric-value.warning { color: var(--danger); }

        /* --- Dense Data Table --- */
        .table-container { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; overflow-x: auto; overflow-y: hidden; display: none; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
        th, td { padding: 8px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; max-width: 200px; overflow: hidden; text-overflow: ellipsis; }
        th { background: #f8fafc; font-weight: 500; color: var(--text-muted); border-bottom: 2px solid var(--border); position: sticky; top: 0; }
        tr:hover { background: #f1f5f9; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
            Data Engine
        </div>
        <div class="nav-items">
            <div class="nav-item active" onclick="switchView('home')">1. Data Quality Hub</div>
            <div class="nav-item" id="nav-builder" onclick="switchView('builder')" style="opacity: 0.5; cursor: not-allowed;">2. Presentation Builder</div>
        </div>
    </div>

    <div class="main-view">
        <div class="header" id="page-title">Data Quality Hub</div>

        <div id="view-home" class="content active">
            
            <div class="upload-bar">
                <div class="file-input-wrapper">
                    <input type="file" id="fileInput" accept=".csv, .xlsx">
                </div>
                <button class="btn btn-primary" id="uploadBtn" onclick="uploadData()">Upload & Profile Data</button>
            </div>

            <div class="metrics-grid" id="metricsGrid">
                <div class="metric-card"><div class="metric-label">Total Rows</div><div class="metric-value" id="m-rows">-</div></div>
                <div class="metric-card"><div class="metric-label">Total Columns</div><div class="metric-value" id="m-cols">-</div></div>
                <div class="metric-card"><div class="metric-label">Missing Cells</div><div class="metric-value" id="m-missing">-</div></div>
                <div class="metric-card"><div class="metric-label">Duplicate Rows</div><div class="metric-value" id="m-dupes">-</div></div>
                <div class="metric-card"><div class="metric-label">Numeric Features</div><div class="metric-value" id="m-num">-</div></div>
                <div class="metric-card"><div class="metric-label">Memory Usage</div><div class="metric-value" id="m-mem">-</div></div>
            </div>

            <div class="table-container" id="tableContainer">
                <table id="dataTable">
                    <thead id="tableHead"></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>

        </div>

        <div id="view-builder" class="content">
            <div style="padding: 20px; background: white; border: 1px solid #e2e8f0; border-radius: 6px;">
                <h3 style="margin-bottom: 10px; font-size: 15px;">Conversational Builder</h3>
                <p style="color: #64748b; font-size: 13px;">The chat interface will be implemented here in Step 2.</p>
            </div>
        </div>
    </div>

    <script>
        let currentSessionId = null;

        // View Switcher Logic
        function switchView(viewName) {
            if (viewName === 'builder' && !currentSessionId) return; // Prevent access before upload
            
            document.querySelectorAll('.content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            
            document.getElementById(`view-${viewName}`).classList.add('active');
            event.currentTarget.classList.add('active');
            
            document.getElementById('page-title').innerText = viewName === 'home' ? 'Data Quality Hub' : 'Presentation Builder';
        }

        // Data Upload & Profiling Logic
        async function uploadData() {
            const fileInput = document.getElementById('fileInput').files[0];
            if (!fileInput) return alert("Select a file to profile.");

            const uploadBtn = document.getElementById('uploadBtn');
            uploadBtn.innerText = "Profiling...";
            uploadBtn.disabled = true;

            const formData = new FormData();
            formData.append("file", fileInput);

            try {
                const response = await fetch("/api/upload", { method: "POST", body: formData });
                const data = await response.json();
                
                currentSessionId = data.session_id;
                
                // Populate Metrics
                document.getElementById('metricsGrid').style.display = 'grid';
                document.getElementById('m-rows').innerText = data.metrics.rows;
                document.getElementById('m-cols').innerText = data.metrics.columns;
                
                const missingEl = document.getElementById('m-missing');
                missingEl.innerText = data.metrics.missing_cells;
                if(data.metrics.missing_cells > 0) missingEl.classList.add('warning');

                const dupesEl = document.getElementById('m-dupes');
                dupesEl.innerText = data.metrics.duplicate_rows;
                if(data.metrics.duplicate_rows > 0) dupesEl.classList.add('warning');

                document.getElementById('m-num').innerText = data.metrics.numeric_features;
                document.getElementById('m-mem').innerText = data.metrics.memory_usage;

                // Populate Table
                document.getElementById('tableContainer').style.display = 'block';
                const thead = document.getElementById('tableHead');
                const tbody = document.getElementById('tableBody');
                
                // Build Headers
                let headerHTML = '<tr>';
                data.columns.forEach(col => headerHTML += `<th>${col}</th>`);
                headerHTML += '</tr>';
                thead.innerHTML = headerHTML;

                // Build Rows
                let bodyHTML = '';
                data.preview.forEach(row => {
                    bodyHTML += '<tr>';
                    data.columns.forEach(col => {
                        bodyHTML += `<td>${row[col]}</td>`;
                    });
                    bodyHTML += '</tr>';
                });
                tbody.innerHTML = bodyHTML;

                uploadBtn.innerText = "Dataset Profiled ✅";
                
                // Unlock Presentation Builder Tab
                const navBuilder = document.getElementById('nav-builder');
                navBuilder.style.opacity = '1';
                navBuilder.style.cursor = 'pointer';

            } catch (err) {
                alert("Error profiling dataset.");
                uploadBtn.innerText = "Upload & Profile Data";
                uploadBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
